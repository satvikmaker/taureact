<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 300px;
      height: 300px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1d1d1f, #2c2c2e);
      animation: pulse 2s ease-in-out infinite;
    }
    .logo {
      font-size: 48px;
      font-weight: 700;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -1px;
    }
    .subtitle {
      margin-top: 8px;
      font-size: 13px;
      color: #98989d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      margin-top: 24px;
      width: 24px;
      height: 24px;
      border: 2px solid #48484a;
      border-top-color: #0a84ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(10, 132, 255, 0.15); }
      50% { box-shadow: 0 0 60px rgba(10, 132, 255, 0.3); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">TauReact</div>
    <div class="subtitle">Loading...</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
